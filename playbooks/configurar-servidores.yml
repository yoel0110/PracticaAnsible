
---
- name: Configurar los cinco servidores Ubuntu
  hosts: servidores
  become: true
  gather_facts: true

  tasks:

    # 1. Actualizar la cache de APT
    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # 2. Crear el usuario itla
    - name: Crear usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        create_home: true
        shell: /bin/bash

    # 3. Crear carpeta app
    - name: Crear directorio app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    # 4. Crear archivo hola.txt
    - name: Crear archivo hola.txt
      ansible.builtin.copy:
        content: "Hola desde Ansible en {{ inventory_hostname }}\n"
        dest: /home/itla/app/hola.txt
        owner: itla
        group: itla
        mode: '0644'

    # 5. Instalar cowsay y htop
    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
